<!--
  ══════════════════════════════════════════════════════════════════
  ALEX MAINGI — EMAIL SIGNATURE
  ══════════════════════════════════════════════════════════════════

  WHAT ACTUALLY WORKS IN EMAIL, AND WHAT DOES NOT
  ─────────────────────────────────────────────────────────────────
  ✓ Hosted images            every client, when images are enabled
  ✓ Clickable links          everywhere
  ✓ Bulletproof buttons      a table with bgcolor, not a CSS button
  ✓ Inline styles            the only styling Gmail reliably keeps
  ~ :hover                   Apple Mail + most webmail. Gmail app: no
  ~ dark mode                Apple Mail yes, Gmail partial, Outlook no
  ✗ JavaScript               stripped by every major client
  ✗ CSS animation            stripped by Gmail, ignored by Outlook
  ✗ data: URI images         Gmail blocks them — images must be hosted
  ✗ forms / inputs           stripped

  So everything below degrades in a defined order. With images off it
  is still a complete, readable signature — the mark falls back to a
  dark tile with initials, and nothing collapses.

  ─────────────────────────────────────────────────────────────────
  BEFORE YOU USE IT — host the image
  ─────────────────────────────────────────────────────────────────
  Push assets/mark-200.png to GitHub, then the src below resolves.
  Verify by opening the raw URL in a browser first. If the image 404s
  every recipient sees the alt text instead.

  ─────────────────────────────────────────────────────────────────
  INSTALLING IN GMAIL
  ─────────────────────────────────────────────────────────────────
  Open this file in a browser → select the rendered block → copy →
  Gmail → Settings → General → Signature → paste.
  Do NOT paste the source. Gmail escapes it and you get raw markup.

  Note: Gmail's signature editor strips the <style> block, so hover
  is lost there. Everything else survives. The hover only applies
  when the HTML is sent directly, as it was on the draft to Sam.
-->
<style>
  /* Stripped by Gmail's signature editor; honoured when the HTML is
     sent as a message body. Nothing here is load-bearing. */
  .sig-link:hover      { color:#ff4a1c !important; }
  .sig-btn:hover       { background-color:#ff4a1c !important; border-color:#ff4a1c !important; }
  .sig-btn:hover a     { color:#ffffff !important; }
  /* NO prefers-color-scheme text overrides — deliberately.
     Flipping text to near-white assumes the client also flips the
     background, and many do not: Gmail applies dark mode selectively,
     Outlook ignores it. The result is white text on white, which is
     how this signature nearly shipped invisible.
     Clients that force dark mode invert dark text themselves. Giving
     them dark text and getting out of the way is the safe play. */
  @media only screen and (max-width:480px) {
    .sig-mark  { display:none !important; }
    .sig-body  { padding-left:0 !important; }
  }
</style>
